name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            executable: plugin
          - platform: macos
            runner: macos-latest
            executable: plugin
          - platform: windows
            runner: windows-latest
            executable: plugin.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Protocol and executable tests
        run: cargo test --locked
      - name: Packaging tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build native executable
        run: cargo build --release --locked
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p stage
          cp "target/release/${{ matrix.executable }}" stage/
      - name: Build universal macOS executable
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/plugin target/x86_64-apple-darwin/release/plugin -output stage/plugin
          lipo stage/plugin -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: stage/${{ matrix.executable }}
          if-no-files-found: error

  package:
    name: Package and run in RustGIS
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combine all three platforms
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          args=(--binaries artifacts)
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          python scripts/package.py "${args[@]}"
      - name: Download rustgis-cli
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTGIS_VERSION: ${{ vars.RUSTGIS_VERSION }}
        shell: bash
        run: |
          args=()
          if [ -n "$RUSTGIS_VERSION" ]; then args+=("$RUSTGIS_VERSION"); fi
          gh release download "${args[@]}" --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          cli=$(find "$RUNNER_TEMP" -path '*/RustGIS-*-linux-x86_64/rustgis-cli' -type f -print -quit)
          test -n "$cli"
          echo "RUSTGIS_CLI=$cli" >> "$GITHUB_ENV"
      - name: Run the command and tool in RustGIS
        run: python scripts/smoke.py --cli "$RUSTGIS_CLI" --strict
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/*.rgplugin
            dist/*.json
          if-no-files-found: error
