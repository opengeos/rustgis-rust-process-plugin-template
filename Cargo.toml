[package]
name = "rustgis-process-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
strip = true
